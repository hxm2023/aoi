# Custom GDAL OSM driver config for the zoning pipeline.
# Extends the default attributes so roads / water / landuse / POI / admin tags
# all land in explicit columns instead of having to be parsed out of HSTORE.
# Used via open option OSM_CONFIG_FILE=<this file>.

closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,waterway,highway=platform,public_transport=platform

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,place,amenity,shop,tourism,office,leisure,craft,man_made,highway,railway,barrier,public_transport,landuse,natural,power,historic,healthcare,education,population,capital,admin_level
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,waterway,railway,barrier,man_made,power,aeroway,boundary,landuse,natural,service,tunnel,bridge,oneway,junction,ref,layer,lanes,width,access,surface,admin_level
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no
computed_attributes=z_order
z_order_type=Integer
z_order_sql="SELECT (CASE [highway] WHEN 'motorway' THEN 9 WHEN 'motorway_link' THEN 9 WHEN 'trunk' THEN 8 WHEN 'trunk_link' THEN 8 WHEN 'primary' THEN 7 WHEN 'primary_link' THEN 7 WHEN 'secondary' THEN 6 WHEN 'secondary_link' THEN 6 WHEN 'tertiary' THEN 4 WHEN 'tertiary_link' THEN 4 WHEN 'residential' THEN 3 WHEN 'unclassified' THEN 3 WHEN 'service' THEN 2 ELSE 1 END) + (CASE WHEN [bridge] IN ('yes','true','1') THEN 10 ELSE 0 END) + (CASE WHEN [tunnel] IN ('yes','true','1') THEN -10 ELSE 0 END) + (CASE WHEN [railway] IS NOT NULL THEN 5 ELSE 0 END)"

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,aeroway,amenity,admin_level,barrier,boundary,building,craft,geological,historic,land_area,landuse,leisure,man_made,military,natural,office,place,shop,sport,tourism,water,waterway,power,population,protect_class,population_date
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,admin_level,boundary,landuse,natural,water,waterway
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no
